name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel & sdist
        run: uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - name: Smoke-test built wheel (CLI & Benchmarks)
        run: |
          uv venv /tmp/warden-smoke-venv
          uv pip install --python /tmp/warden-smoke-venv/bin/python dist/*.whl
          /tmp/warden-smoke-venv/bin/warden --version
          /tmp/warden-smoke-venv/bin/warden bench --json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — no long-lived API secret
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
