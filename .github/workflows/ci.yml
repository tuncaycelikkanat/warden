name: WARDEN CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tam git geçmişi (gitleaks + churn analizi için)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync

      - name: Install Gitleaks (secret scanner)
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install jscpd (duplication detector)
        run: npm install -g jscpd@3.5.10 --silent

      - name: Lint check (ruff)
        run: uv run ruff check core/ tests/ --output-format=github

      - name: Type check (mypy)
        run: uv run mypy core/ --ignore-missing-imports --no-error-summary

      - name: Run test suite
        run: |
          PYTHONPATH=. uv run pytest tests/ -q --ignore=tests/fixtures \
            --tb=short --cov=core --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: WARDEN self-audit (quality gate)
        run: |
          PYTHONPATH=. uv run python -m core.main audit . --min-score 50
        env:
          GEMINI_API_KEY: ""  # Layer 2 olmadan çalışır
        continue-on-error: true  # Başlangıçta başarısız olabilir — uyarı ver ama blokla

  security:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source=. --redact --exit-code 1
