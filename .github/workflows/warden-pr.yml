name: WARDEN PR Audit Comment

on:
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  warden-pr-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install jscpd
        run: npm install -g jscpd@3.5.10 --silent

      - name: Run WARDEN audit
        id: audit
        run: |
          PYTHONPATH=. uv run python -m core.main audit . --format json \
            2>/dev/null > /tmp/warden_result.json || true

          # Fallback: eğer JSON çıktı yoksa basit audit çalıştır
          if [ ! -s /tmp/warden_result.json ]; then
            echo '{"scorecard":{"total_score":0,"grade":"F","layer1_score":0,"layer2_score":-1}}' \
              > /tmp/warden_result.json
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('/tmp/warden_result.json', 'utf8'));
            } catch(e) {
              result = { scorecard: { total_score: 0, grade: 'F', layer1_score: 0 } };
            }

            const sc = result.scorecard || {};
            const score = sc.total_score ?? 0;
            const grade = sc.grade ?? '?';
            const l1 = sc.layer1_score ?? 0;
            const l2 = sc.layer2_score > 0 ? sc.layer2_score : null;
            const groups = {
              '🛡 Güvenlik': sc.group_security,
              '🧪 Kod Sağlığı': sc.group_code_health,
              '🏗 Yapısal': sc.group_structural,
              '⚙ Dayanıklılık': sc.group_resilience,
              '🔧 DevOps': sc.group_dev_hygiene,
            };

            const emoji = score >= 85 ? '✅' : score >= 70 ? '🟡' : score >= 55 ? '⚠️' : '🚨';
            const bar = (v) => {
              if (!v && v !== 0) return '_N/A_';
              const filled = Math.round(v / 10);
              return '`' + '█'.repeat(filled) + '░'.repeat(10 - filled) + `\` ${Math.round(v)}/100`;
            };

            const groupRows = Object.entries(groups)
              .filter(([, v]) => v != null)
              .map(([k, v]) => `| ${k} | ${bar(v)} |`)
              .join('\n');

            const body = [
              `## ${emoji} WARDEN Audit — PR #${{ github.event.pull_request.number }}`,
              '',
              `| Metrik | Değer |`,
              `|---|---|`,
              `| **Toplam Puan** | ${bar(score)} |`,
              `| **Not** | **${grade}** |`,
              `| Katman 1 (Mekanik) | ${bar(l1)} |`,
              l2 ? `| Katman 2 (LLM Rubrik) | ${bar(l2)} |` : '',
              '',
              groupRows ? ['### Grup Skorları', '', '| Grup | Skor |', '|---|---|', groupRows, ''].join('\n') : '',
              score < 60 ? '> ⚠️ **Dikkat:** Skor 60 eşiğinin altında. Merge öncesi güvenlik ve kalite sorunlarını inceleyin.' : '',
              '',
              `_WARDEN v0.1.0 · [Detaylar](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_`,
            ].filter(Boolean).join('\n');

            // Mevcut WARDEN comment'ini güncelle veya yeni yaz
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('WARDEN Audit'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
