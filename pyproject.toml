[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden"
version = "0.1.0"
description = "Autonomous Security & Architectural Quality Governance Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sqlmodel>=0.0.22",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "semgrep>=1.60.0",
    "radon>=6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pip-licenses>=5.0.0",
    "interrogate>=1.7.0",
    "gitpython>=3.1.0",
    "coverage>=7.6.0",
    "pytest>=8.0.0",
]

[project.scripts]
warden = "core.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["core", "mcp_server"]

[tool.pytest.ini_options]
norecursedirs = ["fixtures", "tests/fixtures", ".venv"]

