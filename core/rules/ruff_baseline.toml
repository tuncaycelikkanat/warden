# WARDEN Core Ruff Baseline Configuration
# Evaluated in --isolated mode to prevent target repositories from silencing essential defects.

[lint]
select = [
    "E9",    # Syntax / Runtime errors
    "F821",  # Undefined name
    "F822",  # Undefined name in __all__
    "F823",  # Local variable referenced before assignment
    "F811",  # Redefinition of unused name
    "F401",  # Unused import
    "F841",  # Unused variable
    "B",     # flake8-bugbear (potential bugs & design flaws)
    "S",     # flake8-bandit (security risks)
]
ignore = [
    "S101",  # assert statement (standard in tests)
]
