rules:
  - id: command-injection-shell-true
    severity: ERROR
    languages: [python]
    message: "shell=True ile komut çalıştırma — girdi kontrolsüzse komut enjeksiyonu riski."
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
    paths:
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/conftest.py"
