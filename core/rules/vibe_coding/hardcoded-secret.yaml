rules:
  - id: vibe-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(api_key|secret|token|password).*
    message: "Hardcoded secret or credential detected in variable assignment."
    languages:
      - python
      - javascript
      - typescript
    severity: ERROR
